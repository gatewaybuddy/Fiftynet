version: '3.8'

services:
  fiftynet-api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - MODEL_PATH=trained
      - TOKENIZER_PATH=tokenizer.json
    volumes:
      - ./weights:/app/weights:ro
      - ./tokenizer.json:/app/tokenizer.json:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Optional: Nginx reverse proxy
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - fiftynet-api
    restart: unless-stopped
    profiles:
      - with-nginx
